<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MindAR 6 Targets + Touch Gesture</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body { margin:0; overflow:hidden; }
</style>
</head>

<body>

<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;">

  <a-assets>
    <img id="card0" src="card1.jpg">
    <img id="card1" src="card2.jpg">
    <img id="card2" src="card3.jpg">
    <img id="card3" src="card4.jpg">
    <img id="card4" src="card5.jpg">
    <img id="card5" src="card6.jpg">
  </a-assets>

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- 6 個 TARGET -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-plane src="#card0" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 1">
    <a-plane src="#card1" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 2">
    <a-plane src="#card2" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 3">
    <a-plane src="#card3" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 4">
    <a-plane src="#card4" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

  <a-entity mindar-image-target="targetIndex: 5">
    <a-plane src="#card5" width="1.2" height="0.7" touch-gesture></a-plane>
  </a-entity>

</a-scene>

<script>
AFRAME.registerComponent('touch-gesture', {
  init: function () {
    const el = this.el;

    let scale = 1;
    let rotationZ = 0;

    let startDistance = null;
    let startAngle = null;

    const sceneEl = el.sceneEl;

    let activeEl = null;

    // 👉 點到哪一張卡，就設為 active
    el.addEventListener('click', () => {
      activeEl = el;
    });

    sceneEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        if (!activeEl) return;

        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;

        startDistance = Math.hypot(dx, dy);
        startAngle = Math.atan2(dy, dx);
      }
    });

    sceneEl.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 2 || !activeEl) return;

      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;

      const distance = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      // 🔥 scale
      const scaleChange = distance / startDistance;
      scale *= scaleChange;
      scale = Math.min(Math.max(scale, 0.5), 3);

      activeEl.object3D.scale.set(scale, scale, scale);

      // 🔥 rotation
      const angleChange = angle - startAngle;
      rotationZ += angleChange;

      activeEl.object3D.rotation.z = rotationZ;

      startDistance = distance;
      startAngle = angle;

      e.preventDefault();
    }, { passive: false });

    // 👉 雙擊重置
    let lastTap = 0;

    sceneEl.addEventListener('touchend', () => {
      const now = Date.now();

      if (now - lastTap < 300 && activeEl) {
        scale = 1;
        rotationZ = 0;

        activeEl.object3D.scale.set(1,1,1);
        activeEl.object3D.rotation.set(0,0,0);
      }

      lastTap = now;
    });
  }
});
</script>
